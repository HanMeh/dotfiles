[opener]
emacs = [
    # -n opens the file asynchronously so Yazi doesn't freeze waiting for you to close it
    { run = 'emacsclient -n "$@"', desc = "Open in Emacs", block = false }
]

[open]
rules = [
    # Match text files and use the emacs opener
    { name = "*.txt", use = [ "emacs", "reveal" ] },
    # Match code files, markdown, json, etc.
    { mime = "text/*", use = [ "emacs", "reveal" ] },
    # Fallback catch-all for any files you want to drop into your editor
    { name = "*", use = [ "emacs", "reveal" ] }
]


----------------------------------
[opener]
# Editor rules
emacs = [
    { run = 'emacsclient -n "$@"', desc = "Open in Emacs Server", block = false }
]
nvim = [
    { run = 'nvim "$@"', desc = "Open in Neovim", block = true }
]

# Media rules
video = [
    { run = 'mpv "$1"', desc = "Play Video (MPV)", orphan = true, block = false }
]
image = [
    { run = 'sxiv -q "$@"', desc = "View Image", orphan = true, block = false }
]

# Web/HTML rules
browser = [
    { run = 'xdg-open "$1"', desc = "Open in Browser", orphan = true, block = false }
]

[open]
rules = [
    # 1. Match by precise File Extensions
    { name = "*.html", use = [ "browser", "emacs" ] },
    { name = "*.json", use = [ "emacs", "nvim" ] },

    # 2. Match by broad MIME types (Highly Recommended)
    { mime = "text/*", use = [ "emacs", "nvim" ] },
    { mime = "video/*", use = [ "video" ] },
    { mime = "image/*", use = [ "image" ] },

    # 3. Match directories (Handy for opening folders in editors)
    { mime = "inode/directory", use = [ "emacs" ] },

    # 4. Global Fallback Catch-All
    { name = "*", use = [ "emacs" ] }
]



[opener]
emacs = [
    { run = 'emacsclient -nw "$@"', block = true, desc = "Open in Emacs (Terminal)" },
    { run = 'emacsclient -c "$@"', orphan = true, desc = "Open in Emacs (GUI)" }
]

[open]
rules = [
    { name = "*", use = "emacs" }
]



------------------------------------
[manager]
show_hidden = true
show_symlink = true

[plugin]
# Ensures icon themes load natively over the ANSI color framework
preload = []



---------------------------------------------------
[opener]
# Tells Yazi to open the selected file using your active terminal-mode Emacs buffer
emacs-edit = [
	{ run = 'emacs -nw "$@"', block = true, desc = "Edit in Emacs" }
]

[open]
rules = [
	# Direct all coding language extensions to the Emacs execution rule
	{ mime = "text/*", use = "emacs-edit" },
	{ name = "*.json", use = "emacs-edit" },
	{ name = "*.toml", use = "emacs-edit" },
	{ name = "*.kdl",  use = "emacs-edit" },
	{ name = "*.yaml", use = "emacs-edit" },
	{ name = "*.yml",  use = "emacs-edit" }
]
