# Define a custom shortcut (Super + Shift + L) to lock manually
bindsym $mod+Shift+l exec swaylock --color 1e1e2e

# Configure idle behavior
exec swayidle -w \
     timeout 600 'swaylock --color 1e1e2e' \
     timeout 900 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
     before-sleep 'swaylock --color 1e1e2e'
