----------------------------------------------------------------------------
# =============================================================================
# ALACRITTY FRACTIONAL SCALING FONT CONFIGURATION
# =============================================================================

[font]
# Use clean, modern coding fonts designed for scaling grids
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }

# A base size of 11.0 paired with 1.25 engine scaling results in crisp, 
# readable text on a 14" high-res screen without blurring.
size = 11.0

# Slightly increase line spacing to give scaled characters room to breathe
offset = { x = 0, y = 1 }


======================================
# Alacritty Configuration for a Hyprland Setup

[general]
import = []
live_config_reload = true

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.85
blur = true

[window.decorations]
# Set to "None" if you prefer Hyprland to manage all borders and titlebars
decorations = "None"

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[colors.primary]
background = "0x1e1e2e" # Mocha Base
foreground = "0xcdd6f4" # Mocha Text

[colors.cursor]
text = "0x1e1e2e"
cursor = "0xf5e0dc" # Rosewater

[colors.normal]
black   = "0x45475a"
red     = "0xf38ba8"
green   = "0xa6e3a1"
yellow  = "0xf9e2af"
blue    = "0x89b4fa"
magenta = "0xf5c2e7"
cyan    = "0x94e2d5"
white   = "0 bac2de"

[colors.bright]
black   = "0x585b70"
red     = "0xf38ba8"
green   = "0xa6e3a1"
yellow  = "0xf9e2af"
blue    = "0x89b4fa"
magenta = "0xf5c2e7"
cyan    = "0x94e2d5"
white   = "0xa6adc8"



[shell]
program = "zellij"


# global theme syncs
# Example Alacritty palette hook
[colors.primary]
background = "0x24283b"
foreground = "0xc0caf5"



# ==============================================================================
# ALACRITTY CORE WINDOW & LAYOUT CONFIGURATION
# ==============================================================================

[window]
# Remove interior padding to keep your text grids perfectly square and aligned
padding = { x = 0, y = 0 }
# Force the application to boot borderless; Hyprland will draw structural borders
decorations = "None"
# Launch terminal windows with a standard initial sizing block matrix
dimensions = { columns = 120, lines = 34 }

# ==============================================================================
# TYPOGRAPHY & FONT CONFIGURATION
# ==============================================================================

[font]
# Map your vector-based Terminus Nerd Font for clean coding text and icons
normal = { family = "TerminusNerdFont", style = "Regular" }
bold = { family = "TerminusNerdFont", style = "Bold" }
italic = { family = "TerminusNerdFont", style = "Italic" }

# Base font scale. Adjust this value up or down depending on your screen density
size = 12.0

# Injects 1 extra vertical pixel between text rows to enhance code readability
offset = { x = 0, y = 1 }

# ==============================================================================
# UNIFIED TOKYO NIGHT STORM COLOR PALETTE
# ==============================================================================

[colors.primary]
background = "#24283b" # Moody, deep cyberpunk blue canvas backplate
foreground = "#c0caf5" # Soft white-blue text foreground string tint

[colors.cursor]
text = "#24283b"
cursor = "#c0caf5"

[colors.selection]
text = "CellForeground"
background = "#364a82" # Dark blue-purple selection highlight block

# Normal ANSI Color Register Map (Utilized by Yazi & Zellij themes)
[colors.normal]
black   = "#1d202f"
red     = "#f7768e" # Error states, zip files, deletion warnings
green   = "#9ece6a" # Code buffers, text files, active confirmation messages
yellow  = "#e0af68" # Directory warnings, permissions arrays
blue    = "#7aa2f7" # Standard folders, focus layout lines, active prompts
magenta = "#bb9af7" # Media objects, custom hooks, selections
cyan    = "#7dcfff" # Alternative indicators, helper overlays
white   = "#a9b1d6"

# Bright ANSI Color Variant Map (Enhanced contrast elements)
[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

# ==============================================================================
# TERMINAL INTERACTIVE INTERFACE RULES
# ==============================================================================

[cursor]
# Locks cursor behavior to a solid, stationary block for classic TUI feel
style = { shape = "Block", blinking = "Off" }

[scrolling]
# Stores 10,000 lines of historical console text outputs in your system memory
history = 10000


----------------------------------------
[env]
WINIT_UNIX_BACKEND = "wayland"


