1. Toggle Animations (For Maximum Efficiency)If you want to save every single hardware instruction, you can disable the background visual effects.Find the line: animate = trueChange it to: animate = false2. Change the Visual Theme or EffectIf you prefer a specific aesthetic, Ly offers a couple of built-in console animations:For the digital rain look, make sure animation = 0 is set.For a classic starfield effect, change it to animation = 1.3. Enable Numpad by DefaultMany developers get annoyed when they boot their machine and find their keyboard's number pad disabled. Ly can force it on immediately:Find the line: # numlock = falseUncomment it (remove the #) and change it to: numlock = true4. Save Your Session Choice AutomaticallyEnsure Ly remembers that you prefer Hyprland so you don't have to keep pressing the arrow keys every single time you turn on your PC:Find the line: # save = trueUncomment it to enable: save = trueAfter editing, save and close the file (Ctrl+X, then Ctrl+C
