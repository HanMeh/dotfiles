[device-mac-randomization]
# Randomize MAC address when passively scanning for SSIDs
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
# Generate a new random MAC address for every Wi-Fi connection profile
wifi.cloned-mac-address=stable

--------------------------------
[connection-dhcp]
# Stop broadcasting your actual system hostname during DHCP negotiation
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false

# Option B Alternative: Send a completely randomized hostname string instead
# ipv4.dhcp-hostname=_random_
