# =============================================================================
# HYPRLAND LAUNCH INTEGRATION
# =============================================================================

# Define env variables for Alacritty hardware acceleration natively on Wayland
$gl_flags = env WINIT_UNIX_BACKEND=wayland MESA_LOADER_DRIVER_OVERRIDE=iris

# Bind: Super+Enter boots optimized Alacritty running your structured Zellij layout
bind = SUPER, Return, exec, $gl_flags alacritty -e zellij --layout dev_workspace



# To use it, you just add exec-once = udiskie & to your hyprland.conf file.
# System Tray Applets
exec-once = nm-applet --indicator
exec-once = blueman-applet


# USB Auto-mounting Daemon
exec-once = udiskie --smart-tray


exec-once = emacs --daemon


# Custom Screenshot Binding (PrintScreen key launches your script)
bind = , Print, exec, /home/YOUR_USERNAME/.local/bin/hypr-screenshot.sh

# PrintScreen alone = Select an area with your mouse
bind = , Print, exec, /home/YOUR_USERNAME/.local/bin/hypr-screenshot.sh

# Super + PrintScreen = Capture the entire screen instantly
bind = SUPER, Print, exec, /home/YOUR_USERNAME/.local/bin/hypr-screenshot.sh full



-- Modern Hyprland Autostart Block
hl.on("hyprland.start", function ()
    -- 1. Core Background System Utilities
    hl.exec_cmd("systemctl --user start hyprpolkitagent")  -- Polkit security agent
    hl.exec_cmd("mako")                                   -- Notification daemon
    
    -- 2. Visual & Audio Services
    hl.exec_cmd("waybar")                                  -- Top status bar
    hl.exec_cmd("pipewire & wireplumber")                 -- Sound servers
    
    -- 3. Optional Convenience Apps (Remove/change these if you don't use them)
    -- hl.exec_cmd("nm-applet --indicator")               -- Wi-Fi tray icon
end)

# (Note: If your specific Copr build is utilizing an older legacy version of Hyprland, it will use standard exec-once = waybar lines instead. Check your layout; if the file already contains exec-once examples, append exec-once = systemctl --user start hyprpolkitagent and exec-once = waybar to match its existing format)
