# =============================================================================
# HYPRLAND PERFORMANCE CONFIGURATION FOR THINKPAD X1 CARBON
# =============================================================================

# 1. MONITOR CONFIGURATION (Handles 14" High-Res Display Scaling)
# Syntax: monitor=name,resolution,position,scale
# For 1080p use 1. For 2K/4K/OLED screens, use 1.25 or 1.5 to scale text comfortably.
monitor=,highres,auto,1.25

# 2. DEFAULT APPLICATIONS
$terminal = alacritty -e zellij attach -c dev_session
$menu = fuzzel

# 3. INPUT & TOUCHPAD SETTINGS
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# 4. VISUAL TWEAKS FOR MAXIMUM PERFORMANCE (Low Latency / Zero Overhead)
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33cceeee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 4
    # Performance trick: Set blur to false to completely drop GPU rendering overhead
    blur {
        enabled = false
    }
    # Drops shadows to save hardware cycles
    shadow {
        enabled = false
    }
}

# Disables window animations entirely for instantaneous frame switching
animations {
    enabled = false
}

# 5. HARDWARE CORE KEYBINDINGS (X1 Carbon Media Keys)
# Sets the Windows/Command key as the master modifier key
$mainMod = SUPER

# Application Launchers
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, killactive, 
bind = $mainMod M, Exit, exit, 

# Screen Brightness Keys (Requires 'brightnessctl' package via DNF)
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Audio Volume Keys (Requires 'wireplumber' package via DNF)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# 6. WINDOW MANAGEMENT KEYS (Focusing Panes)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# 7. WORKSPACE SWITCHING (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to a workspace silently
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
