# Launches hardware-accelerated Alacritty with perfect 1.25 text fractional scaling
bind = SUPER, Return, exec, env WINIT_UNIX_BACKEND=wayland MESA_LOADER_DRIVER_OVERRIDE=iris WINIT_X11_SCALE_FACTOR=1.25 alacritty -e zellij attach --create dev_session
